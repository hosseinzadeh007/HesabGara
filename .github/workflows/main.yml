name: Build HesabGara EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: دریافت پروژه
        uses: actions/checkout@v6

      - name: نصب .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: استخراج پروژه
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "HesabGara*.zip" -File |
            Select-Object -First 1

          if (-not $zip) {
            Write-Error "فایل HesabGara ZIP پیدا نشد."
            exit 1
          }

          Write-Host "ZIP: $($zip.Name)"

          New-Item -ItemType Directory -Force -Path extracted | Out-Null

          Expand-Archive `
            -Path $zip.FullName `
            -DestinationPath extracted `
            -Force

      - name: پیدا کردن پروژه C#
        shell: pwsh
        run: |
          $project = Get-ChildItem `
            -Path extracted `
            -Filter "*.csproj" `
            -File `
            -Recurse |
            Select-Object -First 1

          if (-not $project) {
            Write-Error "فایل csproj پیدا نشد."
            exit 1
          }

          Write-Host "PROJECT:"
          Write-Host $project.FullName

          "PROJECT_PATH=$($project.FullName)" >> $env:GITHUB_ENV

      - name: اصلاح System.IO
        shell: pwsh
        run: |
          $files = Get-ChildItem `
            -Path extracted `
            -Filter "*.cs" `
            -File `
            -Recurse

          foreach ($file in $files) {
            $text = Get-Content $file.FullName -Raw

            if (
              $text -match '\bFile\.' -or
              $text -match '\bPath\.' -or
              $text -match '\bDirectory\.'
            ) {
              if ($text -notmatch '(?m)^\s*using\s+System\.IO\s*;') {
                $text = "using System.IO;`r`n" + $text
                Set-Content `
                  -Path $file.FullName `
                  -Value $text `
                  -Encoding UTF8

                Write-Host "System.IO added: $($file.FullName)"
              }
            }
          }

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore "$env:PROJECT_PATH"

      - name: ساخت EXE
        shell: pwsh
        run: |
          Remove-Item `
            -Path "$env:GITHUB_WORKSPACE\publish" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          dotnet publish "$env:PROJECT_PATH" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=false `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o "$env:GITHUB_WORKSPACE\publish"

      - name: بررسی EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\publish\*.exe" `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "EXE ساخته نشد."
            exit 1
          }

          Write-Host "================================"
          Write-Host "HesabGara EXE ساخته شد"
          Write-Host "File: $($exe.Name)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 2)) MB"
          Write-Host "================================"

      - name: دریافت EXE
        uses: actions/upload-artifact@v6
        with:
          name: HesabGara-win-x64
          path: publish/*.exe
          if-no-files-found: error
          retention-days: 14
