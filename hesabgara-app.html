<script>
// بوت‌استرپ به‌روزرسانی خودکار: اگر نسخه‌ی تازه‌تری از اینترنت دریافت و ذخیره شده باشد، بعد از بالا آمدن صفحه جایگزین می‌شود.
// اگر نسخه‌ی دریافتی بالا نیامد (۳ بار پشت‌سرهم)، خودکار به نسخه‌ی داخل برنامه برمی‌گردد.
(function(){
  var K='hesabgara.ota.v1';
  function cmp(a,b){var p=function(v){return String(v).replace(/^v/i,'').split('.').map(function(n){return parseInt(n,10)||0})},x=p(a),y=p(b);for(var i=0;i<Math.max(x.length,y.length);i++){var d=(x[i]||0)-(y[i]||0);if(d)return d>0?1:-1}return 0}
  try{
    var raw=localStorage.getItem(K);if(!raw)return;
    var o=JSON.parse(raw),m=document.querySelector('meta[name="app-version"]'),mine=m?m.content:'0.0.0';
    if(!o||!o.html)return;
    var c=cmp(o.version,mine);
    if(c<0){localStorage.removeItem(K);return}
    if(c===0)return;
    if((o.tries||0)>=3){localStorage.removeItem(K);return}
    o.tries=(o.tries||0)+1;localStorage.setItem(K,JSON.stringify(o));
    window.__otaPending=true;
    var go=function(){try{window.__otaPending=false;document.open();document.write(o.html);document.close()}catch(e){try{localStorage.removeItem(K)}catch(_){}location.reload()}};
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(go,0)});else setTimeout(go,0);
    // نگهبان: اگر نسخه‌ی دریافتی تا ۶ ثانیه بالا نیامد، همین‌جا به نسخه‌ی داخل برنامه برمی‌گردد.
    setTimeout(function(){if(!window.__hgBooted){try{localStorage.removeItem(K)}catch(e){}location.reload()}},6000);
  }catch(e){}
})();
</script>

  if(e.v!==1||e.kdf!=='pbkdf2-sha256'||!(e.iter>=100000&&e.iter<=2000000))throw new Error('format');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:fromB64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(e.iv)},key,fromB64(e.ct)));
}
async function pullCloud(code,password){
  const p=parsePair(code);if(!p)throw new Error('کد اتصال معتبر نیست.');
  if(!password)throw new Error('رمز را وارد کنید.');
  let r;try{r=await fetch(p.u+'/v1/blob/'+p.i,{cache:'no-store'})}catch(e){throw new Error('اتصال برقرار نشد. اینترنت را بررسی کنید (این نسخه باید از اپ نصبی یا آدرس خودتان باز شده باشد).')}
  if(r.status===404)throw new Error('هنوز چیزی از حساب‌گرا ویندوز ارسال نشده است.');
  if(!r.ok)throw new Error('سرور خطا داد ('+r.status+').');
  const box=await r.json();
  let plain;try{plain=await decryptEnvelope(box.data,password)}catch(e){throw new Error('رمز اشتباه است یا داده آسیب دیده است.')}
  const d=JSON.parse(plain);PW=password;
  CL={code:code.trim()};try{localStorage.setItem(CK,JSON.stringify(CL))}catch(e){}
  accept(d);flushOB().catch(()=>{});
}
function openCloud(){
  sheet(`<h1>دریافت از ابر</h1><p class="mut">کد اتصال را از حساب‌گرا ویندوز (تنظیمات ← همگام‌سازی ابری) بگیرید. رمز فقط روی همین گوشی برای باز کردن داده استفاده می‌شود و ذخیره نمی‌شود.</p>
  <input id="cc" type="search" placeholder="کد اتصال (HG1.…)" value="${esc(CL?CL.code:'')}" dir="ltr" autocomplete="off">
  <input id="cp" type="password" placeholder="رمز رمزگذاری" autocomplete="off" style="width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 10px">
  <p><button class="btn" id="cgo">دریافت و رمزگشایی</button></p><p id="cmsg" class="mut" role="status"></p>`);
  const go=$('#cgo');go.onclick=async()=>{
    const msg=$('#cmsg');msg.className='mut';msg.textContent='در حال دریافت...';go.disabled=true;
    try{await pullCloud($('#cc').value,$('#cp').value)}catch(e){msg.className='bad';msg.textContent=e.message||'خطا';go.disabled=false}
  };
}
// ---- ثبت وصول چک از گوشی: پیام رمزگذاری‌شده به صندوق ابری می‌رود و ویندوز آن را اعمال می‌کند ----
const OK_='hesabgara.outbox.v1',COLLECTED='وصول\u200cشده',PENDING='در انتظار وصول';
let OB=[];try{OB=JSON.parse(localStorage.getItem(OK_)||'[]');if(!Array.isArray(OB))OB=[]}catch(e){OB=[]}
let PW='';  // رمز فقط در حافظه‌ی همین جلسه می‌ماند؛ هرگز ذخیره نمی‌شود
const saveOB=()=>{try{localStorage.setItem(OK_,JSON.stringify(OB))}catch(e){}};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join(''));
const toB64=u=>btoa(String.fromCharCode(...u));
function localState(pids){const e=OB.find(x=>x.msg&&x.msg.paymentIds.some(i=>pids.includes(i)));return e?(e.sent?'sent':'queued'):''}
function pruneOB(){
  const st=new Map(D.payments.map(p=>[p.id,p.checkStatus]));
  const keep=OB.filter(e=>Date.now()-e.at<30*864e5&&e.msg.paymentIds.some(i=>st.get(i)===PENDING));
  if(keep.length!==OB.length){OB=keep;saveOB()}
}
async function encryptEnvelope(text,password){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(password.normalize('NFKC')),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text)));
  return JSON.stringify({v:1,kdf:'pbkdf2-sha256',iter:250000,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct)});
}
// رمز را قبل از ارسال با داده‌ی ابری می‌سنجد تا پیامِ بی‌مصرف (رمز غلط) به ابر نرود.
async function verifyPw(pw){
  const p=parsePair(CL&&CL.code);if(!p)throw new Error('ابتدا از «دریافت از ابر» به ابر وصل شوید.');
  let r;try{r=await fetch(p.u+'/v1/blob/'+p.i,{cache:'no-store'})}catch(e){throw new Error('اتصال برقرار نشد. اینترنت را بررسی کنید.')}
  if(!r.ok)throw new Error(r.status===404?'هنوز چیزی از حساب‌گرا ویندوز در ابر نیست.':'سرور خطا داد ('+r.status+').');
  const box=await r.json();
  try{await decryptEnvelope(box.data,pw)}catch(e){throw new Error('رمز اشتباه است.')}
}
async function postInbox(e){
  const p=parsePair(CL&&CL.code);if(!p)throw new Error('ابتدا از «دریافت از ابر» به ابر وصل شوید.');
  const body=await encryptEnvelope(JSON.stringify(e.msg),PW);
  let r;try{r=await fetch(p.u+'/v1/inbox/'+p.i,{method:'POST',headers:{'Content-Type':'application/json'},body})}catch(err){throw new Error('اتصال برقرار نشد. اینترنت را بررسی کنید.')}
  if(r.status===404||r.status===405)throw new Error('سرور ابری هنوز به‌روز نشده است؛ فایل جدید worker.js را در Cloudflare منتشر کنید.');
  if(r.status===429)throw new Error('صندوق پیام سرور پر است؛ در حساب‌گرا ویندوز «دریافت وصول چک از موبایل» را بزنید.');
  if(!r.ok)throw new Error('سرور خطا داد ('+r.status+').');
}
async function collectCheck(c){
  let e=OB.find(x=>x.msg.paymentIds.some(i=>c.pids.includes(i)));
  if(!e){e={sent:false,at:Date.now(),msg:{t:'check-collected',id:uid(),at:new Date().toISOString(),paymentIds:c.pids,checkNumber:c.checkNumber||'',company:c.co,amount:c.amount}};OB.push(e);saveOB()}
  try{await postInbox(e);e.sent=true;saveOB()}
  catch(err){saveOB();throw new Error((err.message||'خطا')+' وصول روی گوشی ثبت ماند؛ بعداً دوباره ارسال کنید.')}
}
async function flushOB(){
  if(!PW)return;let n=0;
  for(const e of OB.filter(x=>!x.sent)){try{await postInbox(e);e.sent=true;n++}catch(err){break}}
  if(n){saveOB();render()}
}
function collectBox(c){
  if(c.local==='sent')return'<p class="mut" role="status">✓ وصول این چک به ابر ارسال شد. وقتی ویندوز آن را دریافت کند و دوباره «دریافت از ابر» بزنید، وضعیت اصلی جایگزین می‌شود.</p>';
  if(c.local==='queued')return'<p class="bad" role="status">⏳ ثبت وصول هنوز به ابر نرسیده است.</p><p><button class="btn" id="colgo">ارسال دوباره</button></p><p id="colmsg" class="mut" role="status"></p>';
  if(c.checkStatus!==PENDING)return'';
  return'<p><button class="btn" id="colgo">ثبت وصول این چک</button></p><p id="colmsg" class="mut" role="status"></p>';
}
function bindCollect(c){
  const b=$('#colgo');if(!b)return;
  b.onclick=()=>{
    const msg=$('#colmsg');
    if(!CL||!parsePair(CL.code)){msg.className='bad';msg.textContent='برای ثبت وصول، اپ باید به ابر وصل باشد: در صفحه‌ی خلاصه «دریافت از ابر» را بزنید.';return}
    b.parentElement.innerHTML=`<p><b>وصول چک ${esc(c.checkNumber||'بدون شماره')} (${fmt(c.amount)} ریال) تأیید شود؟</b></p>${PW?'':'<input id="colpw" type="password" placeholder="رمز رمزگذاری همگام‌سازی" autocomplete="off" style="width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 10px">'}<p><button class="btn" id="colyes">بله، وصول شد</button> <button class="btn alt" id="colno" style="color:var(--link)">انصراف</button></p>`;
    $('#colno').onclick=()=>openChk(c.id);
    $('#colyes').onclick=async()=>{
      const yes=$('#colyes');msg.className='mut';msg.textContent='در حال ارسال...';yes.disabled=true;
      try{
        if(!PW){const pw=($('#colpw')||{}).value||'';if(!pw)throw new Error('رمز را وارد کنید.');await verifyPw(pw);PW=pw}
        await collectCheck(c);render();openChk(c.id);
      }catch(err){render();msg.className='bad';msg.textContent=err.message||'خطا';yes.disabled=false}
    };
  };
}

render();
